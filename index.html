<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ballo Share - Acara Minum Ballo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4efe6;
      --card-bg: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --primary-blue: #2563eb;
      --primary-blue-hover: #1d4ed8;
      --danger-red: #ef4444;
      --header-navy: #0f172a;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-primary); padding: 16px; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .header-card { background: var(--header-navy); color: white; text-align: center; }
    .header-card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .header-card p { font-size: 0.875rem; color: #94a3b8; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-box { background: #f8fafc; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid var(--border-color); }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; }
    .stat-value { font-size: 1.25rem; font-weight: 700; color: var(--primary-blue); margin-top: 4px; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 1rem; outline: none; }
    input:focus { border-color: var(--primary-blue); }
    
    .btn { width: 100%; padding: 12px; background: var(--primary-blue); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--primary-blue-hover); }
    
    .entry-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .entry-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border-color); }
    .entry-info { display: flex; flex-direction: column; }
    .entry-name { font-weight: 600; font-size: 0.95rem; }
    .entry-amount { font-size: 0.85rem; color: var(--text-secondary); }
    
    .actions { display: flex; gap: 6px; }
    .btn-sm { padding: 6px 10px; font-size: 0.75rem; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
    .btn-edit { background: #e2e8f0; color: #334155; }
    .btn-delete { background: #fee2e2; color: var(--danger-red); }

    .status-msg { font-size: 0.85rem; text-align: center; margin-top: 8px; }
    .err { color: var(--danger-red); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card header-card">
      <h1>🍻 Patungan Ballo</h1>
      <p>Batu = Rp 60.000</p>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Total Terkumpul</div>
        <div class="stat-value" id="totalAmount">Rp 0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total Batu</div>
        <div class="stat-value" id="totalBatu">0 Batu</div>
      </div>
    </div>

    <div class="card">
      <form id="contribForm">
        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="nameInput" placeholder="Masukkan nama" required>
        </div>
        <div class="form-group">
          <label>Nominal (Rp)</label>
          <input type="number" id="amountInput" placeholder="Contoh: 60000" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">Tambah Patungan</button>
      </form>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 12px;">Daftar Kontributor</h3>
      <ul class="entry-list" id="entryList"></ul>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://link-87521-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const entriesRef = ref(db, 'entries');

    const form = document.getElementById('contribForm');
    const nameInput = document.getElementById('nameInput');
    const amountInput = document.getElementById('amountInput');
    const entryList = document.getElementById('entryList');
    const totalAmountEl = document.getElementById('totalAmount');
    const totalBatuEl = document.getElementById('totalBatu');
    const statusMsg = document.getElementById('statusMsg');

    let editKey = null;

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const amount = Number(amountInput.value);

      if (!name || amount <= 0) return;

      if (editKey) {
        // Update data
        update(ref(db, `entries/${editKey}`), { name, amount })
          .then(() => {
            resetForm();
            statusMsg.textContent = 'Data berhasil diubah!';
          });
      } else {
        // Tambah data baru
        push(entriesRef, { name, amount, timestamp: Date.now() })
          .then(() => {
            resetForm();
            statusMsg.textContent = 'Berhasil ditambahkan!';
          });
      }
    });

    function resetForm() {
      nameInput.value = '';
      amountInput.value = '';
      editKey = null;
      document.getElementById('submitBtn').textContent = 'Tambah Patungan';
      setTimeout(() => { statusMsg.textContent = ''; }, 3000);
    }

    // Read Realtime Data
    onValue(entriesRef, (snapshot) => {
      entryList.innerHTML = '';
      let total = 0;
      const data = snapshot.val();

      if (data) {
        Object.keys(data).forEach((key) => {
          const item = data[key];
          total += item.amount;

          const li = document.createElement('li');
          li.className = 'entry-item';
          li.innerHTML = `
            <div class="entry-info">
              <span class="entry-name">${item.name}</span>
              <span class="entry-amount">Rp ${item.amount.toLocaleString('id-ID')}</span>
            </div>
            <div class="actions">
              <button class="btn-sm btn-edit" onclick="startEdit('${key}', '${item.name}', ${item.amount})">Edit</button>
              <button class="btn-sm btn-delete" onclick="deleteEntry('${key}')">Hapus</button>
            </div>
          `;
          entryList.appendChild(li);
        });
      }

      totalAmountEl.textContent = `Rp ${total.toLocaleString('id-ID')}`;
      const batu = (total / 60000).toFixed(1);
      totalBatuEl.textContent = `${batu} Batu`;
    });

    // Global Window Functions for Inline Onclick
    window.deleteEntry = (key) => {
      if (confirm('Yakin mau menghapus nama ini?')) {
        remove(ref(db, `entries/${key}`));
      }
    };

    window.startEdit = (key, name, amount) => {
      nameInput.value = name;
      amountInput.value = amount;
      editKey = key;
      document.getElementById('submitBtn').textContent = 'Simpan Perubahan';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  </script>
</body>
</html>
