<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ballo Share - Acara Minum Ballo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Orbitron:wght@800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #f4efe6;
    --card-bg: #ffffff;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --primary-blue: #2563eb;
    --primary-blue-hover: #1d4ed8;
    --header-navy: #0f172a;
    --border-color: #e2e8f0;
    --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    background: #faf7f2;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header Navbar */
  .navbar {
    background-color: var(--header-navy);
    color: #ffffff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  /* Logo RamssLinks - Font Keren & Warna Bunglon */
  .ramss-logo {
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    animation: chameleon 4s linear infinite;
  }

  @keyframes chameleon {
    0%   { color: #ff0055; text-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
    20%  { color: #ff9900; text-shadow: 0 0 8px rgba(255, 153, 0, 0.6); }
    40%  { color: #00ff66; text-shadow: 0 0 8px rgba(0, 255, 102, 0.6); }
    60%  { color: #00e1ff; text-shadow: 0 0 8px rgba(0, 225, 255, 0.6); }
    80%  { color: #9d00ff; text-shadow: 0 0 8px rgba(157, 0, 255, 0.6); }
    100% { color: #ff0055; text-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
  }

  .nav-title {
    font-size: 1.05rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Main Container */
  .container {
    padding: 24px 20px;
    flex: 1;
  }

  .title-section {
    text-align: center;
    margin-bottom: 24px;
  }
  .title-section h1 {
    font-size: 1.5rem;
    margin: 0 0 6px;
    font-weight: 700;
    color: #0f172a;
  }
  .title-section p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 0.95rem;
    font-weight: 600;
  }

  /* Stat Cards */
  .totals {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .totals .box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .box-icon {
    font-size: 1.6rem;
    background: #f1f5f9;
    padding: 8px;
    border-radius: 12px;
  }
  .box-info .num {
    font-size: 1.1rem;
    font-weight: 700;
    color: #0f172a;
    display: block;
  }
  .box-info .lbl {
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  /* Box Khusus Batu */
  .batu-box {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #ffffff;
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .batu-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .batu-info .icon { font-size: 1.5rem; }
  .batu-text { font-size: 0.85rem; color: #94a3b8; }
  .batu-count {
    font-size: 1.25rem;
    font-weight: 800;
    color: #38bdf8;
  }

  /* Form Section */
  form {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  input {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: #f8fafc;
    color: var(--text-primary);
    transition: all 0.2s;
  }
  input:focus {
    outline: none;
    border-color: var(--primary-blue);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }
  button[type=submit] {
    margin-top: 4px;
    background: var(--primary-blue);
    color: #ffffff;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button[type=submit]:hover {
    background: var(--primary-blue-hover);
  }

  .status {
    font-size: 0.85rem;
    min-height: 1.2em;
    margin: -12px 0 16px;
    text-align: center;
    color: var(--text-secondary);
  }
  .status.err { color: #ef4444; }

  /* Entry List */
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
  }
  .user-info { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }
  .user-details .name { font-weight: 600; font-size: 0.95rem; display: block; color: #0f172a; }
  .user-details .amount { color: var(--primary-blue); font-weight: 700; font-size: 0.9rem; }
  .empty { color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 24px 0; }

  footer {
    padding: 16px 20px 24px;
    font-size: 0.85rem;
    color: var(--text-secondary);
    text-align: center;
    border-top: 1px solid var(--border-color);
  }

  /* Font Keren Menyala */
  .glowing-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: #2563eb;
    margin-top: 12px;
    display: block;
    letter-spacing: 2px;
    animation: glow 1.5s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from {
      text-shadow: 0 0 5px #2563eb, 0 0 10px #2563eb, 0 0 15px #3b82f6;
    }
    to {
      text-shadow: 0 0 10px #1d4ed8, 0 0 20px #60a5fa, 0 0 30px #93c5fd;
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="navbar">
    <div class="ramss-logo">RamssLinks</div>
    <div class="nav-title"><span>🌴</span> Ballo Share</div>
  </div>

  <div class="container">
    <div class="title-section">
      <h1>Acara Minum Ballo</h1>
      <p>isimi nama ta' sama berapa ck ta ganggg</p>
    </div>

    <div class="totals">
      <div class="box">
        <div class="box-icon">👥</div>
        <div class="box-info">
          <span class="num" id="totalPeople">0</span>
          <span class="lbl">Orang Ikut</span>
        </div>
      </div>
      <div class="box">
        <div class="box-icon">💵</div>
        <div class="box-info">
          <span class="num" id="totalMoney">0rb</span>
          <span class="lbl">Total Terkumpul</span>
        </div>
      </div>
    </div>

    <!-- Status Pembelian Batu -->
    <div class="batu-box">
      <div class="batu-info">
        <span class="icon">🧊</span>
        <span class="batu-text">Pesanan Saat Ini</span>
      </div>
      <div class="batu-count" id="batuTotal">ambil 0 batu</div>
    </div>

    <form id="joinForm">
      <div class="input-group">
        <input id="nameInput" type="text" placeholder="Isi nama kamu, yuk!" autocomplete="off" required maxlength="40">
      </div>
      <div class="input-group">
        <input id="amountInput" type="number" inputmode="numeric" placeholder="Sumbangan (Rp), misal 20000" min="0" step="1000" required>
      </div>
      <button type="submit">Ikut Berbagi & Catat +</button>
    </form>
    <div class="status" id="statusMsg"></div>

    <ul id="entryList"></ul>
    <div class="empty" id="emptyMsg">Belum ada yang isi. Jadi yang pertama!</div>
  </div>

  <footer>
    isi mki otomatis ji itu totalnya berapa batu mau di pesan
    <span class="glowing-text">#AloooGanggg</span>
  </footer>
</div>

<!-- Firebase Script untuk Database Realtime Online -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Konfigurasi Database Realtime Publik
  const firebaseConfig = {
    databaseURL: "https://ballo-share-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const entriesRef = ref(db, 'ballo_entries');

  function formatRingkas(nominal) {
    const num = Number(nominal || 0);
    if (num >= 1000) {
      const ribuan = num / 1000;
      return (Number.isInteger(ribuan) ? ribuan : ribuan.toFixed(1)) + 'rb';
    }
    return num.toLocaleString('id-ID');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Mendengarkan perubahan data secara REALTIME dari server
  onValue(entriesRef, (snapshot) => {
    const data = snapshot.val();
    const entries = data ? Object.values(data) : [];

    const list = document.getElementById('entryList');
    const empty = document.getElementById('emptyMsg');
    
    list.innerHTML = entries.map(e => `
      <li>
        <div class="user-info">
          <div class="avatar">👤</div>
          <div class="user-details">
            <span class="name">${escapeHtml(e.name)}</span>
            <span class="amount">Rp ${formatRingkas(e.amount)}</span>
          </div>
        </div>
      </li>
    `).join('');

    empty.style.display = entries.length ? 'none' : 'block';
    document.getElementById('totalPeople').textContent = entries.length;
    
    const total = entries.reduce((s,e)=> s + Number(e.amount||0), 0);
    document.getElementById('totalMoney').textContent = 'Rp ' + formatRingkas(total);

    const jumlahBatu = Math.floor(total / 60000);
    document.getElementById('batuTotal').textContent = `ambil ${jumlahBatu} batu`;
  });

  // Kirim data baru ke database online saat tombol ditekan
  const form = document.getElementById('joinForm');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const nameInput = document.getElementById('nameInput');
    const amountInput = document.getElementById('amountInput');
    const name = nameInput.value.trim();
    const amount = Number(amountInput.value);

    if(!name || !(amount >= 0)){
      statusMsg.textContent = 'Isi nama dan nominal dengan benar ya.';
      statusMsg.classList.add('err');
      return;
    }

    push(entriesRef, {
      name: name,
      amount: amount,
      timestamp: Date.now()
    }).then(() => {
      nameInput.value = '';
      amountInput.value = '';
      statusMsg.classList.remove('err');
      statusMsg.textContent = 'Berhasil dicatat secara live!';
      setTimeout(() => { statusMsg.textContent = ''; }, 3000);
    }).catch(() => {
      statusMsg.textContent = 'Gagal menyimpan ke server.';
      statusMsg.classList.add('err');
    });
  });
</script>

</body>
</html>
